<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Bright gold background -->
  <rect width="32" height="32" rx="8" fill="#d4af72"/>
  <!-- Dark graduation cap board -->
  <polygon points="16,6 29,12 16,18 3,12" fill="#06060d"/>
  <!-- Cap body -->
  <path d="M7,14 L7,21 Q7,23 16,25 Q25,23 25,21 L25,14 L16,18 Z" fill="#1a1a2e"/>
  <!-- Tassel line -->
  <line x1="25" y1="12" x2="25" y2="19" stroke="#06060d" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tassel ball -->
  <circle cx="25" cy="21" r="2" fill="#06060d"/>
  <!-- Tassel fringe -->
  <line x1="24" y1="23" x2="23" y2="26" stroke="#06060d" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="25" y1="23" x2="25" y2="27" stroke="#06060d" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="26" y1="23" x2="27" y2="26" stroke="#06060d" stroke-width="1.2" stroke-linecap="round"/>
</svg>
