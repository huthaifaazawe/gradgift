<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" fill="#06060d"/>
  <!-- Graduation cap -->
  <!-- Board (diamond shape) -->
  <polygon points="16,5 28,11 16,17 4,11" fill="#d4af72"/>
  <!-- Cap top shine -->
  <polygon points="16,5 28,11 16,17 4,11" fill="url(#shine)" opacity="0.3"/>
  <!-- Left side of cap body -->
  <path d="M7,13 L7,20 Q7,22 16,24 Q25,22 25,20 L25,13 L16,17 Z" fill="#c89840"/>
  <!-- Tassel string -->
  <line x1="25" y1="11" x2="25" y2="18" stroke="#d4af72" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tassel ball -->
  <circle cx="25" cy="20" r="2" fill="#d4af72"/>
  <!-- Tassel fringe -->
  <line x1="24" y1="22" x2="23" y2="25" stroke="#d4af72" stroke-width="1" stroke-linecap="round"/>
  <line x1="25" y1="22" x2="25" y2="26" stroke="#d4af72" stroke-width="1" stroke-linecap="round"/>
  <line x1="26" y1="22" x2="27" y2="25" stroke="#d4af72" stroke-width="1" stroke-linecap="round"/>
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
</svg>
